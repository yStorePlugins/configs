    &a/evento fila &8- &7Lista a fila de espera de eventos.
    &a/evento ban <jogador> [global|<evento>] [motivo] &8- &7Bane um jogador de um evento ou de todos.
    &a/evento unban <jogador> [global|<evento>] &8- &7Remove o ban de um jogador.
    &a/evento banlist [jogador] &8- &7Lista os bans de eventos.
    &a/evento reload &8- &7Recarrega as configurações.

