# Ativo de exemplo — renomeie este arquivo para definir a chave do ativo.
# A chave do ativo é o nome do arquivo sem o .yml (ex: imobiliario.yml → chave "imobiliario").

# Nome colorido exibido nos menus e mensagens.
display-name: '&eImobiliário'
# Descrição curta do ativo.
description: 'Fundo imobiliário de médio prazo com retorno consistente.'
# Se false, o ativo não aparece no mercado e não aceita novos investimentos.
enabled: true
# Classificação de risco. Valores válidos: [LOW, MEDIUM, HIGH]
risk: MEDIUM
# Retorno base em % ao vencer. É multiplicado pelo risco e pelo mercado.
base-return-percent: 8.0
# Duração do investimento em segundos. [EX: 21600 = 6 horas]
duration-seconds: 21600
# Oscilação por tick do mercado (0.02 = 2%). Também é multiplicada pelo risco.
volatility: 0.02
# Valor mínimo e máximo que o jogador pode aplicar neste ativo.
min-amount: 2500.0
max-amount: 2000000.0
# Permissão necessária para investir. Deixe vazio para liberar a todos.
permission: ''
# Economia travada neste ativo. Deixe vazio para o jogador escolher no menu.
provider: ''
# Taxa de entrada cobrada no momento do investimento (% do valor aplicado).
entry-fee-percent: 1.5
# Taxa de saída cobrada no resgate antecipado (% do valor atual).
withdrawal-fee-percent: 8.0
# Taxa de manutenção cobrada periodicamente (% do valor aplicado). 0 = desativada.
maintenance-fee-percent: 0.1
# Limite de aplicações ativas deste ativo por jogador. 0 = ilimitado.
max-active-per-player: 0

# Ícone no menu de mercado.
# Placeholders: {risk}, {return}, {multiplier}, {duration}, {min}, {max}
icon:
  material: '2560ebc068f27c4fa85225251fddd7762d0919410e45cd8d372534c0ac3b61f1'
  name: '&e&lImobiliário'
  lore:
    - '&7Fundo imobiliário de médio prazo.'
    - ''
    - ' &8▶ &fRisco: &7{risk}'
    - ' &8▶ &fRetorno base: &a{return}%'
    - ' &8▶ &fMercado: &7{multiplier}x'
    - ' &8▶ &fDuração: &7{duration}'
    - ' &8▶ &fMínimo: &7{min}'
    - ' &8▶ &fMáximo: &7{max}'
    - ''
    - '&eInvista agora!'
