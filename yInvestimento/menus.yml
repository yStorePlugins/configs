# Sistema de menus.

# Ativar o sistema de atualizar os menus automaticamente enquanto estiverem abertos
menu-updater: true
# Tempo para atualizar o menu automaticamente
# em ticks -> 20 ticks = 1s | 100 ticks = 5s
menu-updater-time: 100

# Setas dos menus.
arrows:
  back:
    material: 'ARROW:0'
    name: '&cVoltar'
    lore:
      - '&7Clique para voltar ao menu anterior.'
  previous:
    material: 'ARROW:0'
    name: '&cAnterior'
    lore:
      - '&7Clique para ir à página anterior.'
  next:
    material: 'ARROW:0'
    name: '&aPróximo'
