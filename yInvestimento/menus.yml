# ── Menu Principal (menu fixo) ─────────────────────────────────────────────
main-menu:
  name: '&8Bolsa de Valores'
  size: 45
  market-slot: 22
  portfolio-slot: 23
  history-slot: 24
  report-slot: 25
  market:
    material: '209299a117bee88d3262f6ab98211fba344ecae39b47ec848129706dedc81e4f'
    name: '&6Mercado'
    lore:
      - '&7Veja os ativos disponíveis'
      - '&7para investir na bolsa.'
      - ''
      - ' &8▶ &fCDB, Ouro, Imobiliário e Fundos'
      - ''
      - '&eClique para acessar!'
  portfolio:
    material: 'a6cc486c2be1cb9dfcb2e53dd9a3e9a883bfadb27cb956f1896d602b4067'
    name: '&aCarteira'
    lore:
      - '&7Gerencie seus investimentos'
      - '&7ativos e colete os vencidos.'
      - ''
      - '&aClique para acessar!'
  history:
    material: '61a8e6d27b96c0aa4df5b8347260eb051c56944c97d837f22655d8ecbc449137'
    name: '&eHistórico'
    lore:
      - '&7Consulte aplicações encerradas'
      - '&7e resgates anteriores.'
      - ''
      - '&eClique para acessar!'
  report:
    material: '351137e11443a8fbb05fcd3ccc1af9bd2303918f35448185e3ed96ef184da'
    name: '&bRelatório'
    lore:
      - '&7Acompanhe o desempenho dos'
      - '&7ativos e da sua carteira.'
      - ''
      - '&bClique para acessar!'
  facing:
    retorno:
      slot: 10
      material: 'cd91f51266eddc6207f12ae8d7a49c5db0415ada04dab92bb7686afdb17f4d4e'
      name: '&aRetorno base'
      lore:
        - '&7É o percentual esperado ao vencer'
        - '&7o investimento, definido no ativo.'
        - ''
        - ' &8▶ &fExemplo: &a5% &7no CDB'
        - ' &8▶ &fO risco aumenta ou reduz esse valor'
        - ' &8▶ &fO mercado aplica um multiplicador'
        - ''
        - '&7Valor final ≈ aplicado × (1 + retorno)'
        - '&7× multiplicador do mercado.'
    mercado:
      slot: 11
      material: 'cd91f51266eddc6207f12ae8d7a49c5db0415ada04dab92bb7686afdb17f4d4e'
      name: '&6Mercado'
      lore:
        - '&7A bolsa oscila sozinha, como uma'
        - '&7bolsa real. Cada ativo tem um'
        - '&7multiplicador que sobe e desce.'
        - ''
        - ' &8▶ &f1.00x &7= valor estável'
        - ' &8▶ &fAcima de 1.00x &7= alta'
        - ' &8▶ &fAbaixo de 1.00x &7= baixa'
        - ''
        - '&7A volatilidade do ativo define'
        - '&7o tamanho dessas oscilações.'
    risco:
      slot: 19
      material: 'd01afe973c5482fdc71e6aa10698833c79c437f21308ea9a1a095746ec274a0f'
      name: '&cRisco'
      lore:
        - '&7Classifica o ativo e ajusta o'
        - '&7retorno e a volatilidade.'
        - ''
        - ' &8▶ &aBaixo &7— retorno menor, mais estável'
        - ' &8▶ &eMédio &7— equilíbrio'
        - ' &8▶ &cAlto &7— retorno maior, mais oscilação'
        - ''
        - '&7Ativos de alto risco podem'
        - '&7render mais, mas também cair mais.'
    taxas:
      slot: 20
      material: 'd01afe973c5482fdc71e6aa10698833c79c437f21308ea9a1a095746ec274a0f'
      name: '&eTaxas'
      lore:
        - '&7Custos cobrados nas operações.'
        - ''
        - ' &8▶ &fEntrada &7— cobrada ao investir'
        - ' &8▶ &fSaída &7— cobrada no resgate antecipado'
        - ' &8▶ &fManutenção &7— cobrada periodicamente'
        - ''
        - '&7O total debitado no investimento'
        - '&7é o valor aplicado + taxa de entrada.'
    eventos:
      slot: 28
      material: 'cd91f51266eddc6207f12ae8d7a49c5db0415ada04dab92bb7686afdb17f4d4e'
      name: '&6Eventos econômicos'
      lore:
        - '&7Ocorrências aleatórias que alteram'
        - '&7o mercado por alguns minutos.'
        - ''
        - ' &8▶ &6Alta no Ouro &7— ouro sobe'
        - ' &8▶ &cCrise &7— médio e alto risco caem'
        - ' &8▶ &aBoom &7— todos os ativos sobem'
        - ''
        - '&7O multiplicador do evento é'
        - '&7aplicado em cima do mercado.'
    vencimento:
      slot: 29
      material: 'cd91f51266eddc6207f12ae8d7a49c5db0415ada04dab92bb7686afdb17f4d4e'
      name: '&aVencimento e resgate'
      lore:
        - '&7Ao vencer, o investimento fica'
        - '&7disponível para coleta na carteira.'
        - ''
        - ' &8▶ &fVencido &7— colete o retorno'
        - ' &8▶ &fResgate antecipado &7— recebe o'
        - ' &7valor atual menos a taxa de saída'
        - ''
        - '&7O valor atual acompanha o mercado'
        - '&7enquanto a aplicação estiver ativa.'

