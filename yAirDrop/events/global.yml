#
# Evento: Airdrop Global
# Todos os jogadores recebem a localização.
#
# type: NORMAL | LIGHTNING | GLOBAL | SECRET | VIP | PVP | COOPERATIVE | BOSS | WAVES
# lock: segundos extras de tranca na captura (0 = sem tranca extra / instantaneo se capture-seconds tambem for 0)
# animation: NONE | PARACHUTE | BALLOON
# loot.type: ITEM | MONEY | COMMAND
# MONEY.provider = chave de economies.yml

# Nome colorido (mensagens, menus, holograma fallback)
display-name: '&6Airdrop Global'
# Descrição curta (admin/menus)
description: 'Todos recebem a localização.'
# Tipo lógico do evento
type: GLOBAL
# false = não entra no auto-spawn e não pode ser iniciado
enabled: true
# Peso no sorteio automático (maior = mais frequente)
weight: 25
# true = anuncia início no chat global
announce: true
# true = inclui coordenadas na mensagem pública
global-location: true
# true = airdrop secreto (sem coords; radar só após descobrir)
secret: false
# Permissão VIP para abrir (vazio = qualquer um). Ex: yairdrop.vip
vip-permission: ''
# Segundos até a caixa expirar se ninguém abrir
expire-seconds: 900
# Segundos segurando botão direito para capturar
capture-seconds: 8
# Segundos extras de tranca na captura (0 = sem extra)
lock: 5
# Quantas vezes pode ser recolhido no total (sempre 1x por jogador)
max-collects: 1
# Animação de avião cruzando o mapa
animation: PLANE

# Visual da caixa no chão
crate:
  # Material Bukkit: CHEST, BARREL, BEACON, ENDER_CHEST, TRAPPED_CHEST, etc.
  material: ENDER_CHEST
  # CustomModelData (1.14+). 0 = desativado
  custom-model-data: 0
  # Offset do holograma em relacao a caixa (blocos)
  hologram-offset:
    x: 0.0
    y: 1.6
    z: 0.0
  # Linhas do holograma acima da caixa (& cores)
  hologram:
    - '&6&lAirdrop Global'
    - '&7Coletas: &e{left}&7/&e{max-collects}'
    - '&7Todos sabem onde está!'

# Requisitos para abrir a caixa
requirements:
  # ID da chave NBT (dê com /airdrop givekey <jogador> <id>). Vazio = sem chave
  key: ''
  # Senha digitada no chat ao clicar. Vazio = sem senha. "cancelar" aborta
  password: ''
  # Material exigido no inventário (ex: TRIPWIRE_HOOK). Vazio = nenhum
  item: ''
  # Permissão Bukkit exigida. Vazio = nenhuma
  permission: ''
  # Nível mínimo do jogador (0 = desativado)
  level: 0
  # Custo em economia para abrir (0 = grátis)
  money: 0
  # Provider da economia (chave de economies.yml). Ex: money, playerpoints
  money-provider: money
  # Chave de missão que deve estar concluída (missions.yml). Vazio = nenhuma
  mission: ''

# Minigame de hackeamento ao clicar
hack:
  # true = abre minigame antes da captura
  enabled: false
  # SEQUENCE = digitar sequência de números no chat
  type: SEQUENCE
  # Quantidade de dígitos na sequência
  length: 4

# Zona PvP ao aterrissar
pvp:
  # true = ativa zona de combate
  enabled: false
  # Raio da zona em blocos a partir da caixa
  radius: 25

# Exige vários jogadores próximos para abrir
cooperative:
  # true = modo cooperativo
  enabled: false
  # Quantidade mínima de jogadores no raio
  players: 5
  # Raio em blocos ao redor da caixa
  radius: 8

# Boss que deve ser derrotado antes de abrir
boss:
  # true = spawna boss no aterrissar
  enabled: false
  # ID MythicMobs (se plugin presente). Vazio = usa vanilla-type
  mythic-mob: ''
  # EntityType vanilla: WITHER, ZOMBIE, SKELETON, etc.
  vanilla-type: ZOMBIE
  # Vida máxima do boss
  health: 100
  # Nome colorido do boss (opcional)
  name: ''

# Ondas de mobs antes de liberar a caixa
waves:
  # true = sistema de ondas ativo
  enabled: false
  # Ondas (keys livres). Ver waves.yml
  waves: {}


# Tabela de loot sorteada ao abrir
loot:
  # Quantidade mínima de rolls por abertura
  min-rolls: 3
  # Quantidade máxima de rolls por abertura
  max-rolls: 7
  # Possíveis recompensas (keys livres)
  entries:
    item1:
      type: ITEM
      material: DIAMOND
      amount: 3
      chance: 55
      weight: 15
    money:
      type: MONEY
      provider: money
      amount: 2000
      chance: 50
      weight: 12
