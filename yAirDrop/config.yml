#
# Sistemas gerais do airdrop.
general:
  # Máximo de airdrops ativos simultâneos no servidor
  max-active-airdrops: 5
  # Tempo (segundos) padrão até a caixa expirar se não for aberta
  default-expire-seconds: 600
  # Tempo (segundos) de captura padrão (segurar botão direito)
  default-capture-seconds: 5
  # Jogadores necessários no modo cooperativo (fallback se o evento não definir)
  cooperative-players: 5
  # Raio (blocos) para considerar jogadores no cooperativo
  cooperative-radius: 8.0
  # Intervalo de checagem de captura (ticks)
  capture-check-ticks: 5
  # Intervalo (ticks) da lógica pesada (expiração, chuva). Queda roda todo tick.
  tick-interval: 10

  # Proteção básica contra hacks ao interagir com a caixa
  hack-protection:
    # Se true, valida reach e cliques por segundo
    enabled: true
    # Máximo de cliques por segundo permitidos
    max-clicks-per-second: 20
    # Distância máxima (blocos) para clicar na caixa
    max-reach: 6.0
    # Se true, cancela a ação ao detectar comportamento suspeito
    cancel-on-detect: true

  # Sistema de localização do spawn do airdrop
  location:
    # Mundos onde o airdrop pode nascer (nome exato do mundo)
    worlds:
      - world
    # Altitude mínima / máxima do chão sólido
    min-y: 40
    max-y: 180
    # Distância do spawn do mundo (usada se não achar perto de players)
    min-distance-from-spawn: 10
    max-distance-from-spawn: 400
    # Distância de jogadores online
    min-distance-from-players: 5
    max-distance-from-players: 250
    # true = prioriza spawn perto de jogadores (recomendado)
    near-players: true
    # Se true, só usa chunks já carregadas
    only-loaded-chunks: false
    # Se true, carrega a chunk ao escolher o local
    load-chunk: true
    # Tentativas por fase de busca (total ~3-4x isso)
    max-attempts: 80
    # Biomas permitidos (vazio = todos). Ex: [DESERT, PLAINS]
    biomes: []
    # Regiões WorldGuard permitidas (vazio = qualquer). Ex: [arena, pvp]
    regions: []

  # Locais onde o airdrop NUNCA deve nascer
  anti-abuse:
    # Bloquear lava
    block-lava: true
    # Bloquear água
    block-water: true
    # Bloquear folhas
    block-leaves: true
    # Bloquear árvores
    block-trees: true
    # Bloquear cavernas
    block-caves: true
    # Bloquear teto
    block-ceiling: true
    # Bloquear void
    block-void: true

  # Proteção da caixa enquanto fechada
  protection:
    # Impede quebrar o bloco
    break: true
    # Impede TNT destruir
    tnt: true
    # Impede creeper destruir
    creeper: true
    # Impede pistão mover
    piston: true
    # Impede água/lava empurrar
    water: true
    # Impede fogo queimar
    fire: true

  # Configuração padrão da animação de queda
  fall:
    # Altura inicial acima do alvo (blocos)
    height: 40
    # Velocidade de queda em blocos por tick (0.4 ≈ suave; 0.8 = mais rápido)
    speed: 0.45
    # Exibir partículas durante a queda
    particles: true
    # Efeito de fogo
    fire: false
    # Efeito de fumaça
    smoke: true
    # Raio ao aterrissar
    lightning: false
    # Explosão visual (sem dano) ao aterrissar
    explosion: false
    # Materiais do visual PARACHUTE
    parachute:
      # Itens da cúpula (cicla entre eles nas gores)
