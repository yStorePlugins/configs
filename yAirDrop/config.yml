  # Sistema de radar (item bússola)
  radar:
    # Intervalo de atualização (ticks)
    update-ticks: 20
    # Distância máxima de rastreio (blocos)
    max-distance: 500
    # Exibir bossbar (se suportado)
    bossbar: true
    # Exibir actionbar com distância/direção
    actionbar: true

  # Ativar sistema de temporadas (pasta seasons/)
  seasons-enabled: true
  # Temas por bioma (efeitos visuais)
  biome-themes-enabled: true
  # Efeitos especiais com chuva/tempestade
  weather-effects-enabled: true
  # Multiplicador de chance de spawn automático à noite
  night-chance-multiplier: 1.5

  # Sons (nomes de Sound do Bukkit)
  sounds:
    drop-start: 'ENTITY_FIREWORK_ROCKET_LAUNCH'
    drop-land: 'ENTITY_GENERIC_EXPLODE'
    open-success: 'ENTITY_PLAYER_LEVELUP'
    open-fail: 'ENTITY_VILLAGER_NO'
    capture-tick: 'BLOCK_NOTE_BLOCK_PLING'
    hack-success: 'ENTITY_EXPERIENCE_ORB_PICKUP'
    wave-spawn: 'ENTITY_ZOMBIE_AMBIENT'
    boss-spawn: 'ENTITY_WITHER_SPAWN'
    rain-start: 'WEATHER_RAIN'

# Auto-start: vários tipos independentes, cada um com whitelist de eventos
# events: chaves de events/*.yml (ex: normal). Vazio = todos enabled
autostart:
  # Ligar/desligar o sistema inteiro
  enabled: true
  types:
    # Tipo comum — airdrops básicos
    comum:
      enabled: true
      interval-min-seconds: 300
      interval-max-seconds: 600
      min-players: 1
      amount: 1
      chance: 100
      warn-seconds: 30
      worlds: []
      events:
        - normal
        - lightning
        - secret
    # Tipo especial — boss / waves / global
    especial:
      enabled: true
      interval-min-seconds: 900
      interval-max-seconds: 1200
      min-players: 3
      amount: 1
      chance: 80
      warn-seconds: 60
      worlds: []
      events:
        - boss
        - waves
        - global
        - pvp
        - cooperative
        - vip

# Bússola/radar comprável no menu de airdrops ativos (/ad list)
compass-buy:
  # Permissão para pegar a bússola no menu (vazio = todos)
  permission: 'yairdrop.compass'
  # Economias cobradas ao pegar (chave de economies.yml → valor).
  # Deixe vazio ou comente as linhas para grátis.
  costs:
    money: 1000
    # cash: 50

# Textos coloridos dos status exibidos ao jogador
status:
  falling: '&eCaindo'
  landed: '&aNo chão'
  capturing: '&6Capturando'
  locked: '&cTrancado'
  opened: '&bAberto'
  expired: '&7Expirado'
  fighting: '&cCombate'
  boss: '&5Boss'
  waves: '&dOndas'
