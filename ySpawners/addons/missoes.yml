#
# Sistema de missões (ySpawnersMissoesAddon).
# O jogador completa missões matando mobs do spawner.
# O progresso é por tipo de spawner (ex: cow, zombie).
#
# Placeholders:
#  {progress}  - progresso atual do jogador
#  {amount}    - quantia necessária
#  {spawner}   - nome do spawner
#
# spawners: []  = vale para todos os tipos
# spawners: ['cow']  = somente o tipo informado (nome do arquivo em spawners/)

missoes:
  1:
    amount: 100
    spawners: []
    display:
      material: BOOK
      name: '&aIniciante'
      lore:
        - '&7Mate {amount} mobs deste spawner.'
        - ''
        - ' &fProgresso: &7{progress}/{amount}&f.'
        - ''
        - '&7Continue matando para completar.'
    display-complete:
      material: BOOK
      name: '&aIniciante'
      lore:
        - '&7Mate {amount} mobs deste spawner.'
        - ''
        - ' &fProgresso: &a{progress}/{amount}&f.'
        - ''
        - '&aClique para coletar a recompensa.'
    display-collected:
      material: BOOK
      name: '&aIniciante'
      lore:
        - '&7Mate {amount} mobs deste spawner.'
        - ''
        - ' &fProgresso: &a{progress}/{amount}&f.'
        - ''
        - '&aVocê já coletou esta missão.'
    item:
      give: false
      material: DIAMOND
      amount: 1
      name: '&bDiamante'
      lore: []
    command:
      give: true
      list:
        - 'give {player} diamond 1'
