# Animais da fazenda (GUI + entidade/holograma em packet)
#
# Os animais são comprados no menu ou no clique da entidade, empilhados
# (ex.: Vaca x10) e produzem itens virtuais com o tempo.
# Posição no mapa: /fazendaadmin setar animal <id>
# Entidade e holograma só aparecem para jogadores no raio configurado.
#
# Cada chave em "animals" é o ID interno do animal.
#
# Campos:
#   display           - nome colorido no menu
#   entity            - EntityType da entidade em packet (COW, CHICKEN, SHEEP...)
#   hologram-offset   - offset Y do holograma acima do animal
#   hologram          - linhas do holograma em packet
#   unlock-level      - nível mínimo da fazenda para comprar
#   order             - ordem no menu
#   prices-default    - provider + price para comprar (yfazenda, money, etc.)
#   max-stack         - máximo acumulável deste animal
#   produce-key       - ID interno do produto (usado no armazenamento virtual)
#   produce-display   - nome do produto exibido
#   produce-prices    - provider + price ao vender 1 unidade (yfazenda, money, etc.)
#   produce-amount    - quantidade produzida por animal a cada intervalo
#   interval-seconds  - intervalo de produção em segundos
#   produce-item      - item físico ao coletar (em vez de vender)
#   icon              - item do menu. Cabeça custom: material: '<hash>'
#
# Placeholders do icon/holograma: {amount} {max} {produce} {product} {interval} {cost} {yfazenda} {money} {animal}

animals:
  cow:
    display: '&fVaca'
    entity: COW
    hologram-offset: 0.5
    hologram:
      - '&f{animal} &7x{amount}/{max}'
      - '&7Produzido: &f{product}x {produce}'
      - '&eClique para gerenciar'
    unlock-level: 1
    order: 1
    prices-default:
      farm:
        provider: 'yfazenda'
        price: 150
      vault:
        provider: 'money'
        price: 0
    max-stack: 64
    produce-key: 'milk'
    produce-display: '&fLeite'
    produce-prices:
      farm:
        provider: 'yfazenda'
        price: 2.0
      vault:
        provider: 'money'
        price: 0
    produce-amount: 1
    interval-seconds: 30
    produce-item:
      material: 'MILK_BUCKET'
      name: '&fLeite'
    icon:
      material: '5d6c6eda94a44911f6a5176b4c869a4b1dd2cc86d7d8b469f082f5c57d5c8'
      name: '&fVaca'
      lore:
        - ''
        - ' &7Quantidade: &f{amount}/{max}'
        - ' &7Produz: &f{produce}'
        - ' &7Intervalo: &f{interval}s'
        - ' &7Moedas: &f{yfazenda}'
        - ' &7Dinheiro: &f{money}'
        - ''
        - ' &eClique para comprar 1'
        - ''
  chicken:
    display: '&eGalinha'
    entity: CHICKEN
    hologram-offset: 1.35
