        price: 80
      vault:
        provider: 'money'
        price: 0
    max-stack: 64
    produce-key: 'egg'
    produce-display: '&eOvo'
    produce-prices:
      farm:
        provider: 'yfazenda'
        price: 1.0
      vault:
        provider: 'money'
        price: 0
    produce-amount: 1
    interval-seconds: 20
    produce-item:
      material: 'EGG'
      name: '&eOvo'
    icon:
      material: '1638469a599ceef72075341da1167c51acb8169ca0f4142476070c4e143533'
      name: '&eGalinha'
      lore:
        - ''
        - ' &7Quantidade: &f{amount}/{max}'
        - ' &7Produz: &f{produce}'
        - ' &7Intervalo: &f{interval}s'
        - ' &7Moedas: &f{yfazenda}'
        - ' &7Dinheiro: &f{money}'
        - ''
        - ' &eClique para comprar 1'
        - ''
  sheep:
    display: '&7Ovelha'
    entity: SHEEP
    hologram-offset: 1.55
