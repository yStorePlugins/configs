#
# Sistema de menus.
#
# Material: MATERIAL ou MATERIAL:DATA (ex.: STAINED_GLASS_PANE:15, WOOL:5)
# Cabeças de jogador: SKULL_ITEM:3 ou '{player}'
# Cabeça custom (minecraft-heads): material: '<hash>'
# facing: itens decorativos. Cada entrada precisa de slot.
# Scroller: slots = área rolável; previous-slot / next-slot fora dela; back-slot: -1 = sem voltar
# Lore com espaço inicial ' &7...' é o padrão visual.

# Setas dos menus (carregadas em Config.setup).
arrows:
  back:
    material: 'ARROW:0'
    name: '&cVoltar'
    lore:
      - ' &7Clique para voltar.'
  previous:
    material: 'ARROW:0'
    name: '&cAnterior'
    lore:
      - ' &7Clique para ir à página anterior.'
  next:
    material: 'ARROW:0'
    name: '&aPróximo'
    lore:
      - ' &7Clique para ir à próxima página.'

