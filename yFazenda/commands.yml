#
# Lista de comandos do plugin.

# Utilize "comando|alias" para criar aliases.
# O primeiro segmento é o nome registrado; os seguintes são aliases.
# Por exemplo: "fazenda|farm|yf"
commands:
  # Comando do jogador. Permissão: yfazenda.use
  # Subcomandos: ir [jogador], sair, amigos, reload
  yfazenda: "fazenda|farm|yf"
  # Comando administrativo. Permissão: yfazenda.admin
  # Subcomandos: wand <fazenda>, define <fazenda>, criar <id>, setar <spawn|saida> [fazenda], give <jogador> <quantia>, enxada [jogador], reload
  yfazendaadmin: "fazendaadmin|farmadmin|yfa"
