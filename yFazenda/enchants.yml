# Encantamentos da enxada (animações em packets)
#
# Não apague a chave (ID) dos encantamentos que for usar — o type precisa bater com o código.
#
# Types (animações diferenciadas legacy/newest):
#   harvest     - colhe área ao redor (quadrado no mesmo Y)
#   storm       - raios em packet + colheita em esfera
#   rain        - chuva de partículas + colheita em área
#   tornado     - redemoinho de partículas + colheita em esfera
#   burst       - explosão de partículas + colheita em esfera
#   linear      - colhe em linha (eixo X)
#   meteor      - meteoros de fogo caindo + colheita em esfera
#   helix       - dupla hélice subindo + colheita em área
#   wave        - onda no chão se expandindo
#   bloom       - floração de partículas
#   nova        - implosão + explosão
#   pulse       - anéis pulsantes
#   blizzard    - nevasca
#   vortex      - vórtice de portal
#   fortune     - bônus de drops (sem área / sem animação)
#   multiplier  - bônus de moedas (sem área / sem animação)
#
# Campos:
#   display            - nome no menu e na lore da enxada
#   type               - tipo listado acima
#   chat / title / actionbar - mensagens ao ativar. Title usa <nl> para subtítulo. Vazio = não envia
#   sound              - Sound do Bukkit ao ativar. Vazio = sem som
#   order              - ordem no menu
#   unlock-level       - nível mínimo da fazenda para comprar
#   max-level          - nível máximo do encantamento
#   chance-per-level   - chance (%) de ativar por nível na colheita. 0 = passivo (fortune/multiplier)
#   radius             - raio base da área. Cresce +1 por nível extra
#   cost-multiplier    - multiplicador por nível (price * multiplier ^ (nível-1))
#   delay-seconds      - delay entre ativações
#   animation          - se true, dispara a animação em packets
#   icon               - item do menu
#
# Placeholders do icon lore: {level} {max} {level_next} {chance} {chance_next} {radius} {radius_next} {cost} {yfazenda} {money}
# prices-default / prices-per-level / prices-disenchanter: provider + price (yfazenda = moedas da fazenda)

