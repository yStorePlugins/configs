# Plantações (apenas sementes e fungos)
#
# Cada chave em "crops" é o ID interno da plantação.
#
# Campos:
#   display        - nome colorido exibido ao jogador
#   material       - bloco de packet maduro. Formato MATERIAL ou MATERIAL:DATA (ex.: CROPS:7 = trigo maduro)
#   to-material    - opcional. Bloco após colher (ex.: CROPS:0 = trigo sem crescer). Vazio = some (ar)
#   seed           - semente/fungo associado (informativo / drops)
#   unlock-level   - nível mínimo da fazenda para desbloquear
#   order          - ordem de evolução (precisa comprar na sequência)
#   chance         - peso (%) desta plantação aparecer na área após desbloqueada
#   value          - moedas da fazenda ganhas por colheita
#   xp             - XP da fazenda ganho por colheita
#   grow-ticks     - tempo em ticks para a plantação voltar a nascer (20 ticks = 1s)
#   prices-default - provider + price para desbloquear (yfazenda, money, etc.)
#   icon           - item do menu de plantações
#   drops          - drops especiais na colheita (chance 0-100)
#     chance       - probabilidade (%) de dropar
#     commands     - comandos no console. Placeholder: {player}
#     item         - item dado ao jogador (SetupItem)
#
# Placeholders do icon lore: {value} {cost} {level} {status} {yfazenda} {money}

crops:
  wheat:
    display: '&eTrigo'
    material: 'CROPS:7'
    to-material: 'CROPS:0'
    seed: 'SEEDS'
    unlock-level: 1
    order: 1
    chance: 100
    value: 1.0
    xp: 1.0
    grow-ticks: 40
    prices-default:
      farm:
        provider: 'yfazenda'
        price: 0
      vault:
        provider: 'money'
        price: 0
    icon:
      material: 'WHEAT'
      name: '&eTrigo'
      lore:
        - ''
        - ' &7Valor: &f{value}'
        - ' &7Moedas: &f{yfazenda}'
        - ' &7Dinheiro: &f{money}'
        - ' &7Nível: &f{level}'
        - ' {status}'
        - ''
    drops:
      seed:
        chance: 5.0
        commands: []
        item:
          material: 'SEEDS'
          name: '&eSemente Extra'
          amount: 1
