# Menu para editar chance/raridade de um item
edit-item:
  name: '&8Caixa'
  size: 27
  back-slot: 9
  items:
    item-slot: 13
    chance-slot: 11
    rarity-slot: 15
    # Ícone exibido no menu da crate (pode ser diferente do item dado)
    icon-slot: 14
    chance:
      material: GOLD_INGOT
      name: '&aChance'
      lore:
        - '&7Altere a chance para ganhar esse'
        - '&7item na crate.'
        - ''
        - '&fChance atual: &a{chance}%'
        - ''
        - '&aClique para alterar.'
    icon:
      material: ITEM_FRAME
      name: '&aÍcone do menu'
      lore:
        - ''
        - '&7Ícone exibido no menu da crate.'
        - '&7Pode ser diferente do item dado.'
        - ''
        - '&aClique em um item do inventário'
        - '&apara alterar o ícone.'
        - '&cClique direito aqui para resetar.'
    rarity:
      material: PAPER
      name: '&aRaridade'
      lore:
        - '&7Altere a raridade desse'
        - '&7item da crate.'
        - ''
        - '&fRaridade atual: &a{rarity}'
        - ''
        - '&aClique para alterar.'

