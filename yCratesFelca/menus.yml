# Sistema de menus.

# Setas dos menus (voltar / página anterior / próxima).
arrows:
  back:
    material: 'ARROW:0'
    name: '&cVoltar'
    lore:
      - ' &7Clique para voltar.'
  previous:
    material: 'ARROW:0'
    name: '&cAnterior'
    lore:
      - ' &7Clique para ir à página anterior.'
  next:
    material: 'ARROW:0'
    name: '&aPróximo'
    lore:
      - ' &7Clique para ir à próxima página.'

# Menu do jogador ao interagir com a crate (lei Felca — escolher recompensa)
choose:
  name: '&8Escolha sua recompensa abaixo'
  size: 36
  # Slots das recompensas (itens/comandos da crate selecionada)
  reward-slots: [10, 11, 12, 13, 14, 15, 16]
  # Slots das abas de crate (mesmo group)
  crate-slots: [28]
  # Slots dos botões de comprar chaves (1, 3, 5, 10, 25)
  buy-slots: [30, 31, 32, 33]
  # Slot do seletor de economia (clique para ciclar)
  economy-slot: 35
  # Lore do ícone de economia ({economy}, {balance})
  economy:
    lore:
      - ''
      - ' &7Economia: &f{economy}'
      - ' &7Saldo: &f{balance}'
      - ''
      - ' &aClique para alterar'
  # Lore extra nas recompensas (com chave / sem chave)
  reward:
    lore-collect:
      - ''
      - '&aCLIQUE PARA COLETAR.'
    lore-locked:
      - ''
      - '&cVocê precisa de chaves ativas.'
  # Lore das abas de crate ({keys})
  crate-icon:
    lore-has:
      - '&7Você precisa chaves ativas deste tipo'
      - '&7para escolher uma das recompensas.'
      - ''
      - '&7Você tem &a{keys} &7chave(s).'
    lore-empty:
      - '&7Você precisa chaves ativas deste tipo'
      - '&7para escolher uma das recompensas.'
      - ''
      - '&cVocê não possui chaves'
      - '&cpara abrir esta caixa.'
      - ''
  # Botões de compra ({amount}, {rewards}, {price_line}, {discount_line}, {balance_line})
  buy:
    material: 'TRIPWIRE_HOOK'
    glow: true
    name: '&5Comprar &d{amount} &5chave(s)!'
    lore:
      - '&7Escolha uma das &f{rewards}'
      - '&7recompensas acima com estas chaves.'
      - ''
      - '&cAdquira já por apenas:'
      - '&c{price_line}'
      - '{discount_line}'
      - ''
      - '{balance_line}'
    price-normal: '&c{price} {economy}.'
    price-discount: '&c&m{original}&r &c{price} {economy}.'
    discount: '&a&lDESCONTO DE {discount}%'
    no-balance: '&cCréditos insuficientes.'
    has-balance: '&aClique para comprar.'

# Menu principal de edição in-game (/cratefelca edit <crate>)
settings:
  name: '&8Caixa'
  size: 27
  items:
    crate-slot: 13
    items-slot: 11
    commands-slot: 15
    items:
      material: 'CHEST'
      name: '&aEditar Itens'
      lore:
        - '&7Clique para editar as recompensas'
        - '&7em forma de itens desta crate.'
        - ''
        - '&aClique para abrir'
    commands:
      material: 'PAPER'
      name: '&aEditar Comandos'
      lore:
        - '&7Clique para editar as recompensas'
        - '&7em forma de comandos desta crate.'
        - ''
        - '&aClique para abrir'

# Lista de recompensas em item (Scroller)
settings-items:
  name: '&8Caixa'
  size: 54
  slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43 ]
  previous-slot: 18
  next-slot: 26
  back-slot: 48
  items:
    add-slot: 50
    lore:
      - ''
      - '&fChance: &b{chance}%'
      - '&fRaridade: &7{rarity}&f.'
      - ''
      - '&aBotão &fESQUERDO&a para editar.'
      - '&aBotão &fDIREITO&a para deletar.'
    add:
      material: 'CHEST'
      name: '&aAdicionar Item'
      lore: [ '&7Clique para adicionar mais', '&7um item como recompensa.' ]

# Lista de recompensas em comando (Scroller)
settings-commands:
  name: '&8Caixa'
  size: 54
  slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43 ]
