# Nome que aparecerá nas mensagens e hologramas
display: '&bRara'

# Crates do mesmo grupo aparecem juntas como abas no menu ao interagir
group: 'raras'

# Verificar se o inventário está lotado antes de coletar
verify-inv: true

# Permissão para abrir esta crate. Deixe vazio para não usar.
permission: ''

# Item admin para colocar a crate no chão
item:
  material: ENDER_CHEST
  glow: true
  name: '&bCaixa &3Rara&b.'
  lore:
    - '&7Coloque-a no chão para gerar a crate.'

# Sistema de chaves
key:
  # Item físico da chave (clique direito para ativar e enviar ao menu)
  item:
    material: TRIPWIRE_HOOK
    glow: true
    name: '&dChave Épica'
    lore:
      - '&7Use esta chave para'
      - '&7abrir a crate &5Épica&7.'
      - ''
      - '&aClique para ativar.'
  # Preço unitário por economia (chaves de economies.yml)
  prices:
    money: 150.0
    playerpoints: 25.0
  # Pacotes de compra no menu: quantia: percentual de desconto
  buy:
    1: 0
    5: 0
    10: 10
    25: 25

# Ícone da aba desta crate no menu de escolha
icon:
  material: d01afe973c5482fdc71e6aa10698833c79c437f21308ea9a1a095746ec274a0f
  name: '&bCaixa Rara'
  lore: []

# Holograma que irá aparecer em cima da crate
hologram:
  enabled: true
  # Altura em relação à crate
  off-set: 2.5
  # X em relação à crate
  off-set-x: 0.5
  # Z em relação à crate
  off-set-z: 0.5
  lines:
    - '&bCrate &3Rara&b.'
    - '&7Escolha a recompensa que quiser.'
    - '&7Estoque: &f{stock}&7/&f{max} &8| {status}'
    - ''
    - '&7Clique para abrir o menu.'
    # Use [item]MATERIAL para colocar um item no holograma
    # - '[item]DIAMOND_BLOCK'
  # Linhas usadas quando o estoque chega a 0 (stock.enabled: true)
  sold-out-lines:
    - '&bCrate &3Rara&b.'
    - '&c&lESGOTADO'
    - '&7Volte mais tarde.'
  status-available: '&aDisponível'
  status-sold-out: '&cEsgotado'
  # Visual do holograma (FancyHolograms / backend que suportar)
  transparent-background: true
  background-color: '#000000'
  background-opacity: 200
  text-shadow: false
  see-through: false
  text-opacity: 255
  visibility-distance: 70
  line-spacing: 0.0
  scale: 1.0
  billboard: CENTER

# Estoque limitado de chaves desta crate (compra no menu consome)
stock:
  enabled: false
  max: 50
  current: 50
  restock:
    enabled: false
    interval-seconds: 3600
    amount: 0
  last-restock: 0

# Tipo da entidade da crate no mundo
# Valores: BLOCK, NPC, ARMORSTAND, ROTATING_HEAD, GIANT, MYTHICMOBS, DISPLAY_ENTITY
entity:
  type: BLOCK
  # Skin do NPC (nick ou TEXTURE:SIGNATURE)
  skin: 'Steve'
  # NPC olhar para o jogador
  look-close: true
  # Mostrar nametag do NPC
  nametag: false
  # Item no capacete do ArmorStand / mão do Giant / ItemDisplay
  item: 'ENDER_CHEST'
  # Escala do ItemDisplay (1.19.4+)
  scale: 1.0
  # Se true, o ItemDisplay gira acompanhando o jogador (billboard). Se false, fica fixo na direção da crate.
  follow-player: false
  # Nome interno do MythicMobs (se type = MYTHICMOBS)
  mythicmob: ''
  # Velocidade da rotação (ROTATING_HEAD)
  speed: 4
  # Altura do ArmorStand / cabeça
  height: -1.2

# Sistema de bloco de vidro (quando type = BLOCK)
glass:
  # A crate vai gerar um vidro com uma cabeça dentro?
  enabled: false
  # Material do vidro
  material: 'STAINED_GLASS'
  # Material da cabeça dentro do vidro
  head: 'ENDER_CHEST'
  # Data da cor do vidro
  data: 11
  # Ajuste da cabeça dentro do vidro
  off-set: -1.2

# Locais das caixas. Não altere nada aqui.
locations: []
