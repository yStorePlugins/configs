#
# Configurações do banco de dados.

database:
  # Determina o tipo de banco de dados. Valores válidos: [SQLITE, MYSQL, HIKARI (recomendado)]
  storage-type: SQLITE

  # Dados para conexão ao banco de dados MYSQL.
  data:
    # Endereço de conexão do banco de dados. [EX: 127.0.0.1]
    host: localhost
    # Porta de conexão do banco de dados. [EX: 3306]
    port: 3306
    # Nome do banco de dados a ser conectado. [EX: minecraft]
    database: ''
    # Usuário de conexão. [EX: root]
    username: ''
    # Senha do usuário de conexão: [EX: 123]
    password: ''

# Configurações do servidor redis
redis:
  # Ativar a conexão com o redis
  enabled: false
  # Endereço de conexão. [EX: 127.0.0.1]
  host: 'localhost'
  # Porta de conexão. [EX: 3306]
  port: 6379
  # Usuário de conexão. [EX: root]
  username: ''
  # Senha do usuário de conexão: [EX: 123]
  password: ''

# Delay para carregar os dados depois do login
# Necessário para usar em servidor de mina separado
# Recomendado: 20 ticks
login-delay: 20

# Carregar as crates depois de x tempo que o server ligar
# Em ticks (20 ticks = 1 segundo)
spawn-delay: 20

# Sistemas gerais
general:
  # Se true, /givekey adiciona chaves virtuais no menu. Se false, entrega o item físico.
  give-virtual: true
  # Dar as keys físicas compactadas em 1 item só
  give-compact: true
  # Distância máxima para clicar em rotating-head / display
  interact-distance: 6.0

# Sons (nomes de Sound do Bukkit)
sounds:
  # Som ao concluir uma ação com sucesso
  success: 'ENTITY_EXPERIENCE_ORB_PICKUP'
  # Som ao falhar (sem chave, sem saldo, etc.)
  fail: 'ENTITY_VILLAGER_NO'
  # Som ao coletar uma recompensa
  collect: 'ENTITY_PLAYER_LEVELUP'
  # Som ao comprar chaves no menu
  buy: 'ENTITY_EXPERIENCE_ORB_PICKUP'
  # Som ao ativar uma chave física
  activate: 'ENTITY_EXPERIENCE_ORB_PICKUP'
