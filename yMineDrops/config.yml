# Discord: discord.ystoreplugins.com.br
# Site: ystoreplugins.com.br

# Modo de depuração para correção de problemas no plugin.
debug-mode: false

database:
  # Determina o tipo de banco de dados. Valores válidos: [SQLITE, MYSQL, HIKARI (recomendado)]
  storage-type: SQLITE

  # Dados para conexão ao banco de dados MYSQL.
  data:
    # Endereço de conexão do banco de dados. [EX: 127.0.0.1]
    host: localhost
    # Porta de conexão do banco de dados. [EX: 3306]
    port: 3306
    # Nome do banco de dados a ser conectado. [EX: minecraft]
    database: ''
    # Usuário de conexão. [EX: root]
    username: ''
    # Senha do usuário de conexão: [EX: 123]
    password: ''

# Configurações do servidor redis
redis:
  # Ativar a conexão com o redis
  enabled: false
  # Endereço de conexão. [EX: 127.0.0.1]
  host: 'localhost'
  # Porta de conexão. [EX: 3306]
  port: 6379
  # Usuário de conexão. [EX: root]
  username: ''
  # Senha do usuário de conexão: [EX: 123]
  password: ''

# Delay para carregar os dados depois do login
# Necessário para usar em servidor de mina separado
# Recomendado: 20 ticks
login-delay: 20

# Sistemas gerais
general:
  # Ativar o PvP no mundo da mina
  pvp: false
  # Deixar o jogador invencível na mina
  invincibility: false
  # Se ativo, esmeraldas só dropam em biomas Extreme Hills
  emerald-extreme-hills: true
  # Proibir spawn de mobs no mundo da mina
  disable-mobs: true
  # Enviar os itens direto para o inventário do jogador
  auto-pickup: true
  # Ao ativar, envia no chat o bioma do jogador ao quebrar um bloco
  biome-debug: false
  # Skill do mcMMO / AuraSkills / ySkills que recebe o XP
  mcmmo-skill: 'MINING'
  # Bloco que ao quebrar irá dropar minérios
  block: 'STONE'
  # Porcentagem base da Fortune ao dropar minérios
  fortune-percent: 3
  # Delay (em segundos) para usar o comando /minerar novamente
  command-cooldown: 120
  # Se true, recompensas vão para o armazém (menu). Se false, são entregues imediatamente.
  warehouse:
    enabled: true
  # Drops que serão removidos ao nascer no mundo da mina
  remove-drops:
    - 'COBBLESTONE'
    - 'STONE'
  # Comandos bloqueados dentro do mundo da mina
  blocked-commands:
    - '/g oi'
  # Efeitos aplicados nos jogadores da mina. Formato: EFEITO:AMPLIFIER
  effects:
    - 'FAST_DIGGING:1'
    - 'INVISIBILITY:1'
  # Biomas considerados Extreme Hills (usado com emerald-extreme-hills)
  extreme-hills-biomes:
    - 'EXTREME_HILLS'
    - 'EXTREME_HILLS_PLUS'
    - 'EXTREME_HILLS_MOUNTAINS'
    - 'EXTREME_HILLS_PLUS_MOUNTAINS'
    - 'EXTREME_HILLS_WITH_TREES'
    - 'MUTATED_EXTREME_HILLS'
    - 'MUTATED_EXTREME_HILLS_WITH_TREES'
    - 'SMALLER_EXTREME_HILLS'
    - 'BIRCH_FOREST_HILLS'
    - 'BIRCH_FOREST_HILLS_MOUNTAINS'
    - 'COLD_TAIGA_HILLS'
    - 'DESERT_HILLS'
    - 'FOREST_HILLS'
    - 'JUNGLE_HILLS'
    - 'MEGA_SPRUCE_TAIGA_HILLS'
    - 'MEGA_TAIGA_HILLS'
    - 'TAIGA_HILLS'
  world:
    # Regenerar o mundo da mina ao iniciar o servidor (somente se não houver jogadores)
    generate: true
    # Mundo desenhado pelo plugin
    custom: true
    # Nomes dos mundos da mina
    names:
      - 'world_mining'
    # Mundos onde ao minerar ORES não droparão nada
    ore-block:
      - 'world'
    # Raio de teleport do comando /minerar
    radius:
      x: 2000
      z: 2000
