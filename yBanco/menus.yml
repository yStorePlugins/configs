#
# Sistema de menus.

# Setas dos menus.
arrows:
  back:
    material: 'ARROW:0'
    name: '&cVoltar'
    lore:
      - ' &7Clique para voltar.'
  previous:
    material: 'ARROW:0'
    name: '&cAnterior'
    lore:
      - ' &7Clique para ir à página anterior.'
  next:
    material: 'ARROW:0'
    name: '&aPróximo'
    lore:
      - ' &7Clique para ir à próxima página.'

# Menu principal
main:
  name: '&8Banco'
  size: 27
  profile:
    slot: 11
    material: '{player}'
    name: '&aSuas informações'
    lore:
      - ''
      - ' &7Tier: &f{tier}'
      - ' &7Economia selecionada: &f{provider}'
      - ' &7Saldo no banco: &a{bank}'
      - ' &7Saldo em mãos: &a{hand}'
      - ''
  history:
    slot: 12
    material: 'BOOK'
    name: '&aHistórico'
    lore:
      - ''
      - ' &7Clique para ver seu histórico.'
      - ''
  operations:
    slot: 14
    material: 'EMERALD'
    name: '&aOperações'
    lore:
      - ''
      - ' &7Depositar, sacar ou criar cheque.'
      - ''
  top:
    slot: 15
    material: 'DIAMOND'
    name: '&aTop'
    lore:
      - ''
      - ' &7Jogadores mais ricos do banco.'
      - ''
  upgrade:
    slot: 22
    material: 'NETHER_STAR'
    name: '&6Upgrades'
    lore:
      - ''
      - ' &7Tier atual: &f{tier}'
      - ' &7Evolua sua conta bancária.'
      - ''
  facing: {}

# Seleção de economia
economy-select:
  name: '&8Selecione a Economia'
  size: 27
  slots: [10, 11, 12, 13, 14, 15, 16]
  previous-slot: 18
  next-slot: 26
  back-slot: 22
  facing: {}

# Operações (depósito / saque / cheque)
operations:
  name: '&8Operações — {provider}'
  size: 27
  back-slot: 18
  deposit:
    slot: 11
    material: 'CHEST'
    name: '&aDepositar'
    lore:
      - ''
      - ' &7Clique para depositar {provider}.'
      - ' &7Mínimo: &f{min}'
      - ' &7Taxa: &f{tax}%'
      - ''
      - ' &eDigite o valor no chat'
      - ''
  withdraw:
    slot: 13
    material: 'HOPPER'
    name: '&cSacar'
    lore:
      - ''
      - ' &7Clique para sacar {provider}.'
      - ' &7Mínimo: &f{min}'
      - ' &7Taxa: &f{tax}%'
      - ' &7Limite: &c{used}&7/&a{max}'
      - ''
      - ' &eDigite o valor no chat'
      - ''
  cheque:
    slot: 15
    material: 'PAPER'
    name: '&eCheque'
    lore:
      - ''
      - ' &7Clique para criar um cheque.'
      - ' &7Mínimo: &f{min}'
      - ' &7Taxa: &f{tax}%'
      - ' &7Limite: &c{used}&7/&a{max}'
      - ''
      - ' &eDigite o valor no chat'
      - ''
  # Alternar economia (abre o seletor)
  economy:
    slot: 22
    material: 'GOLD_INGOT'
    name: '&6Economia: &f{provider}'
    lore:
      - ''
      - ' &7Economia atual: &f{provider}'
      - ' &7Saldo no banco: &a{bank}'
      - ' &7Saldo em mãos: &a{hand}'
      - ''
      - ' &eClique para alternar a economia'
      - ''
  facing: {}

# Histórico
history:
  name: '&8Histórico de operações'
  size: 45
  slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
  previous-slot: 36
  next-slot: 44
  back-slot: 40
  deposit-item:
    material: 'EMERALD'
    name: '&aDepósito'
    lore:
      - ''
      - ' &7Economia: &f{provider}'
      - ' &7Valor: &a{amount}'
      - ' &7Taxa: &f{tax}%'
      - ' &7Data: &f{date} &8- &f{time}'
      - ''
  withdraw-item:
    material: 'REDSTONE'
    name: '&cSaque'
    lore:
      - ''
      - ' &7Economia: &f{provider}'
      - ' &7Valor: &c{amount}'
      - ' &7Taxa: &f{tax}%'
      - ' &7Data: &f{date} &8- &f{time}'
      - ''
  cheque-item:
    material: 'PAPER'
    name: '&eCheque'
    lore:
      - ''
      - ' &7Economia: &f{provider}'
      - ' &7Valor: &e{amount}'
      - ' &7Taxa: &f{tax}%'
      - ' &7Data: &f{date} &8- &f{time}'
      - ''
  interest-item:
    material: 'GOLD_NUGGET'
    name: '&6Rendimento'
    lore:
      - ''
      - ' &7Economia: &f{provider}'
      - ' &7Valor: &6{amount}'
      - ' &7Data: &f{date} &8- &f{time}'
      - ''
  facing: {}

# Top
top:
  name: '&8TOP Banco — {provider}'
  size: 45
  slots: [10, 11, 12, 13, 14, 15, 16]
  previous-slot: 36
  next-slot: 44
  back-slot: 40
  item:
    material: '{player}'
    name: '&e#{pos} &f{player}'
    lore:
      - ''
      - ' &7Saldo: &a{amount}'
      - ' &7Tier: &f{tier}'
      - ''
  facing: {}

# Upgrades / Tiers (Scroller — suporta quantos tiers existirem em tiers.yml)
upgrade:
  name: '&8Upgrades da Conta'
  size: 45
  slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
  previous-slot: 36
  next-slot: 44
  back-slot: 40
  current-lore-extra:
    - ''
    - ' &a&lSEU NÍVEL ATUAL'
  next-lore-extra:
    - ''
    - ' &eClique para evoluir'
    - ' &7Custo: &f{cost}'
  owned-lore-extra:
    - ''
    - ' &aJá conquistado'
  locked-lore-extra:
    - ''
    - ' &cBloqueado'
  facing: {}

# Item do cheque
cheque:
  material: 'PAPER'
  name: '&aCheque de {provider}'
  lore:
    - ''
    - ' &7Criado por: &a{player}'
    - ' &7Criado em: &f{date} &8- &f{time}'
    - ''
    - ' &bValor: &a{amount}'
    - ' &7Economia: &f{provider}'
    - ''
    - ' &7Clique com botão direito para ativar'
    - ''
  glow: true
