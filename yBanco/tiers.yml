#
# Sistema de Upgrades e Juros Regressivos
#
# Quantidade de tiers: ILIMITADA — crie quantos quiser (chaves '1', '2', '3'...).
# Basta adicionar/remover seções em 'tiers:' e recarregar (/banco reload).
#
# Juros por faixas (brackets): o saldo é dividido em faixas e cada faixa
# rende à sua própria taxa (regressivo — faixas altas rendem menos %).
#   max: teto da faixa em valor absoluto (-1 = ilimitado / resto do saldo)
#   rate: % de rendimento daquela faixa por ciclo
#
# max-yield-per-cycle: teto de rendimento por ciclo (anti-inflação).
# max-balance: 0 = ilimitado.
# upgrade-cost: custo para ALCANÇAR este tier (pago na economia com upgrade-currency: true).
#               O tier inicial (default-tier) deve ter upgrade-cost: 0.
# withdraw-tax-discount: % de desconto na taxa de saque/cheque.

default-tier: 1

