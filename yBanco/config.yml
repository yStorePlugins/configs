# Discord: discord.ystoreplugins.com.br
# Site: ystoreplugins.com.br

# Modo de depuração para correção de problemas no plugin.
debug-mode: false

database:
  # Determina o tipo de banco de dados. Valores válidos: [SQLITE, MYSQL, HIKARI (recomendado)]
  storage-type: SQLITE

  # Dados para conexão ao banco de dados MYSQL.
  data:
    # Endereço de conexão do banco de dados. [EX: 127.0.0.1]
    host: localhost
    # Porta de conexão do banco de dados. [EX: 3306]
    port: 3306
    # Nome do banco de dados a ser conectado. [EX: minecraft]
    database: ''
    # Usuário de conexão. [EX: root]
    username: ''
    # Senha do usuário de conexão: [EX: 123]
    password: ''

# Configurações do servidor redis
redis:
  # Ativar a conexão com o redis
  enabled: false
  # Endereço de conexão. [EX: 127.0.0.1]
  host: 'localhost'
  # Porta de conexão. [EX: 6379]
  port: 6379
  # Usuário de conexão. [EX: root]
  username: ''
  # Senha do usuário de conexão: [EX: 123]
  password: ''

# Delay para carregar os dados depois do login
# Necessário para usar em servidor de mina separado
# Recomendado: 20 ticks
login-delay: 20

# Sistemas gerais
general:
  # Quando o jogador realizar operação, salvar imediatamente
  auto-save: false
  # Ativar perda de money em mãos ao morrer
  death-loss: true
  # Mundos em que não perde money ao morrer (BLACKLIST)
  death-blacklist:
    - 'Plot'
  # Máximo de entradas no histórico por jogador
  history-max: 20
  # Resetar contadores de limite após X segundos
  limit-reset-seconds: 86400
  # Tempo (segundos) para digitar no chat antes de cancelar automaticamente
  chat-input-timeout-seconds: 30
  # Top ranking size
  top-size: 7
  # Intervalo do top em ticks (10 min = 12000)
  top-interval-ticks: 12000

  # NPC do banco
  npc:
    skin: 'deliveryman'
    hologram-offset: 3.1
    hologram-lines:
      - '&6&lBanco'
      - '&7Clique para abrir o banco.'

  # Selic (juros programados) — usa faixas do tier do jogador
  selic:
    enabled: true
    # segunda, terca, quarta, quinta, sexta, sabado, domingo, todos
    # formato: dia-hora:minuto:segundo
    schedules:
      - 'todos-9:00:00'

  # Bolsa (yBolsa) — rendimento extra periódico
  bolsa:
    enabled: false
    interval-seconds: 30

  sounds:
    deposit-success: 'ENTITY_EXPERIENCE_ORB_PICKUP'
    withdraw-success: 'ENTITY_EXPERIENCE_ORB_PICKUP'
    fail: 'ENTITY_VILLAGER_NO'
    upgrade: 'ENTITY_PLAYER_LEVELUP'
    cheque: 'ENTITY_ITEM_PICKUP'
