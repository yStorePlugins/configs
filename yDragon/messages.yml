# Plugin messages

chat:
  syntax: '&cUse: /{command} {syntax}'
  target: '&cJogador {player} não encontrado.'
  number: '&cO argumento não é um número.'
  permission: '&cVocê não tem permissão para fazer isto.'
  console: '&cApenas jogadores in-game podem realizar esta ação.'
  cancelled: '&cVocê cancelou a ação.'
  reload: '&aConfigurações recarregadas com sucesso.'
  inv-full: '&cSeu inventário está cheio. Itens extras foram dropados no chão.'
  help: |

    &8&m-&r &5&lDragon &8— &7Comandos
    &8&m-&r
    &8&m-&r &e/{cmd} &8- &7Abre o menu de dragões.
    &8&m-&r &e/{cmd} top &8- &7Abre o ranking de dano.
    &8&m-&r &e/{cmd} armazem &8- &7Abre o armazém de recompensas.
    &8&m-&r &e/{cmd} info [dragão] &8- &7Mostra informações do evento.
    &8&m-&r

  admin-help: |

    &8&m-&r &5&lDragon Admin &8— &7Comandos
    &8&m-&r
    &8&m-&r &e/{cmd} &8- &7Abre o menu de dragões.
    &8&m-&r &e/{cmd} top &8- &7Abre o ranking de dano.
    &8&m-&r &e/{cmd} armazem &8- &7Abre o armazém de recompensas.
    &8&m-&r &e/{cmd} info [dragão] &8- &7Mostra informações do evento.
    &8&m-&r &e/{cmd} spawn [dragão] &8- &7Spawna o dragão manualmente.
    &8&m-&r &e/{cmd} stop &8- &7Encerra o evento atual.
    &8&m-&r &e/{cmd} setarena <dragão> [raio] &8- &7Define a arena desse dragão.
    &8&m-&r &e/{cmd} setspawn <dragão> &8- &7Define o spawn desse dragão.
    &8&m-&r &e/{cmd} list &8- &7Lista os dragões carregados.
    &8&m-&r &e/{cmd} reload &8- &7Recarrega as configurações.
    &8&m-&r

  dragon-not-found: '&cDragão {dragon} não encontrado.'
  dragon-disabled: '&cO dragão {dragon} está desativado.'
  already-active: '&cJá existe um evento de dragão em andamento.'
  not-active: '&cNão há evento de dragão ativo.'
  arena-not-set: '&cA arena do dragão {dragon} ainda não foi definida. Use /{cmd} setarena {dragon}'
