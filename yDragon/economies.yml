# Economia padrão utilizada pelo plugin.
# Deve corresponder a uma das chaves definidas em 'economies' abaixo.
default: 'money'

economies:
  money:
    provider: 'Money'
    display: 'Dinheiro'
    abbreviated: 'coins'
    symbol: '$'
    allow-offline: true
    permission: ''
    item:
      material: GOLD_INGOT
      name: '&aDinheiro'
      lore:
        - ''
        - ' &7Economia: &fVault/Money'
        - ''
    item-settings:
      material: GOLD_INGOT
      name: '&aDinheiro'
      lore:
        - ''
        - ' &7Tipo: &fMoney'
        - ' &aClique para alterar'
        - ''
  playerpoints:
    provider: 'PlayerPoints'
    display: 'PlayerPoints'
    abbreviated: 'pp'
    symbol: ''
    allow-offline: true
    permission: ''
    item:
      material: EMERALD
      name: '&aPlayerPoints'
      lore:
        - ''
        - ' &7Economia: &fPlayerPoints'
        - ''
    item-settings:
      material: EMERALD
      name: '&aPlayerPoints'
      lore:
        - ''
        - ' &7Tipo: &fPlayerPoints'
        - ' &aClique para alterar'
        - ''
