  help: |

    &dComandos da party:

    &d-> &f/{cmd} &8-&7 Abre o menu da party
    &d-> &f/{cmd} <jogador> &8-&7 Convida um jogador
    &d-> &f/{cmd} invite <jogador> &8-&7 Convida um jogador
    &d-> &f/{cmd} aceitar [jogador] &8-&7 Aceita um convite
    &d-> &f/{cmd} negar [jogador] &8-&7 Recusa um convite
    &d-> &f/{cmd} sair &8-&7 Sai da party
    &d-> &f/{cmd} membros &8-&7 Lista os membros da party
    &d-> &f/{cmd} chat [mensagem] &8-&7 Ativa o chat da party ou envia uma mensagem
    &d-> &f/{cmd} tp &8-&7 Teleporta para a sessão do líder
    &d-> &f/{cmd} kick <jogador> &8-&7 Expulsa um membro
    &d-> &f/{cmd} transferir <jogador> &8-&7 Transfere a liderança
    &d-> &f/{cmd} promover <jogador> &8-&7 Promove a moderador
    &d-> &f/{cmd} rebaixar <jogador> &8-&7 Rebaixa a membro
    &d-> &f/{cmd} abrir &8-&7 Abre a party (entrada livre)
    &d-> &f/{cmd} fechar &8-&7 Fecha a party (somente convite)
    &d-> &f/{cmd} desfazer &8-&7 Desfaz a party

