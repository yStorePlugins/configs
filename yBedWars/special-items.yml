#
# Itens especiais.
#
# enabled: se false, o item não ativa o comportamento especial.
# cooldown: segundos entre usos (0 = sem cooldown).
# duration: duração em segundos (TNT = pavio, ponte = tempo do ovo).
# range: alcance em blocos.
# damage / knockback: dano e recuo horizontal.
# knockback-vertical: impulso vertical mínimo.
# knockback-vertical-bonus: extra no Y somado à velocidade atual (fireball).
# knockback-min: força horizontal mínima (fireball).
# knockback-radius: raio do empurrão em blocos (fireball).
# max-amount: 0 = ilimitado. No percevejo = quantos podem existir no chão ao mesmo tempo (compra na loja continua livre).
# destroy-blocks: se explosões/habilidades podem quebrar blocos da partida.
# nbt-key: tag NBT usada para identificar o item.

