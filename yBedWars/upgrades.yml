#
# Loja de upgrades da equipe.
#
# slot: posição no menu Melhorias do Time.
# description: linhas da lore.
# max-level 1 mostra "Preço:"; vários níveis mostram "X Nível n:".
# queueable: true = armadilha (máx. 3 na fila). false = upgrade permanente.
# currency: iron | gold | diamond | emerald
# prices: lista por nível (índice 0 = nível 1).

