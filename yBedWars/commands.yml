#
# Lista de comandos do plugin.

# Utilize "comando|alias" para criar aliases.
# Por exemplo: "bedwars|bw|ybedwars"
commands:
  # Comando do jogador. Abre o menu de modos / join / leave / stats.
  bedwars: "bedwars|bw|ybedwars|ybw"
  # Comando admin. Sem argumentos abre o editor de arenas in-game.
  admin: "bwadmin|bedwarsadmin|bwa"
  # Reconecta o jogador à partida após cair.
  reconectar: "reconectar|reconnect|rc"
  # Chat global da partida.
  global: "g|global|gchat|shout"
  # Chat da equipe.
  teamchat: "t|teamchat"
