# Sistema de menus.
#
# material: MATERIAL ou MATERIAL:DATA (ex: WOOL:5). Cabeça de jogador: '{player}'.
# slots: área rolável do Scroller. previous-slot / next-slot ficam fora dela.
# back-slot: -1 desativa o botão voltar.
# facing: itens decorativos. Cada entrada precisa de slot.

# Varinha de seleção (pos1/pos2 e safezone).
