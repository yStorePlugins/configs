#
# Plugin messages
#
# chat: mensagens de chat (uma por ação).
# actionbar: barras persistentes (2+ variantes).
# title: títulos. Use <nl> para separar título e subtítulo.

# Mensagens de chat — agrupadas por funcionalidade.
chat:
  syntax: '&cUse: /{cmd} {syntax}'
  target: '&cJogador {player} não encontrado.'
  number: '&cO argumento não é um número.'
  permission: '&cVocê não tem permissão para fazer isto.'
  console: '&cApenas jogadores in-game podem realizar esta ação.'
  cancelled: '&cVocê cancelou a ação.'
  reload: '&aConfigurações recarregadas com sucesso.'
  inv-full: '&cSeu inventário está cheio.'
  help: |

    &6&lComandos do jogador
    &a/{cmd} &8- &7Abre o menu de modos.
    &a/{cmd} help &8- &7Mostra esta ajuda.
    &a/{cmd} join [arena|modo] &8- &7Entra na fila ou em um mapa.
    &a/{cmd} leave &8- &7Sai da partida.
    &a/{cmd} spectate [arena] &8- &7Assiste uma partida.
    &a/{cmd} stats [jogador] &8- &7Ver estatísticas.
    &a/{cmd} classe &8- &7Classes e recompensas.
    &a/{cmd} top &8- &7Ranking de vitórias.
    &a/{cmd} reconectar &8- &7Volta após cair da partida.
    &a/{cmd} party &8- &7Cria uma party.
    &a/{cmd} party invite <jogador> &8- &7Convida para a party.
    &a/{cmd} party accept &8- &7Aceita o convite.
    &a/{cmd} party leave &8- &7Sai da party.
    &a/reconectar &8- &7Atalho para reconectar.
    &a/g <msg> &8- &7Chat global da partida.
    &a/t <msg> &8- &7Chat da equipe.
    &7Aliases: &fentrar, sair, spec, ranking, class, rc
  admin-help: |

    &6&lComandos admin &7(/bwadmin)
    &a/{cmd} &8- &7Abre o editor de arenas.
    &a/{cmd} help &8- &7Mostra esta ajuda.
    &a/{cmd} reload &8- &7Recarrega as configurações.
    &a/{cmd} start [arena] &8- &7Inicia a partida.
    &a/{cmd} end [arena] &8- &7Encerra a partida.
    &a/{cmd} list &8- &7Lista as arenas.
    &a/{cmd} create <id> [modo] &8- &7Cria uma arena.
    &a/{cmd} delete <id> &8- &7Apaga a arena.
    &a/{cmd} enable <id> &8- &7Ativa a arena.
    &a/{cmd} disable <id> &8- &7Desativa a arena.
    &a/{cmd} save [id] &8- &7Salva a arena.
    &a/{cmd} select <id> &8- &7Seleciona a arena (não precisa repetir o id).
    &a/{cmd} edit [id] &8- &7Abre o editor da arena.
    &a/{cmd} tp [id] [lobby|exit|spec|spawn] [time] &8- &7Teleporta.
    &a/{cmd} wand &8- &7Varinha de seleção (pos1/pos2).
    &a/{cmd} setpos1 [id] &8- &7Pos1 na sua posição.
    &a/{cmd} setpos2 [id] &8- &7Pos2 na sua posição.
    &a/{cmd} define [id] &8- &7Aplica os limites da varinha.
    &a/{cmd} setlobby [id] &8- &7Lobby na sua posição.
    &a/{cmd} setexit [id] &8- &7Saída na sua posição.
    &a/{cmd} setspectator [id] &8- &7Espectador na sua posição.
     &a/{cmd} setspawn [id] <time> &8- &7Spawn do time.
     &a/{cmd} setbed [id] <time> &8- &7Cama do time.
     &a/{cmd} setchest [id] <time> &8- &7Baú do time (olhando para ele).
     &a/{cmd} setenderchest [id] <time> &8- &7Ender chest do time (olhando para ele).
    &a/{cmd} setshop [id] <time> &8- &7NPC da loja.
    &a/{cmd} setupgrade [id] <time> &8- &7NPC de melhorias.
    &a/{cmd} setgenerator [id] <time|diamond|emerald> &8- &7Gerador.
    &a/{cmd} setsafezone [id] <time> &8- &7Safezone da varinha.
    &a/{cmd} setnpc <solo|doubles|trios|squads|duel> &8- &7NPC de fila.
    &a/{cmd} delnpc <tipo> &8- &7Remove o NPC de fila.
    &a/{cmd} instances &8- &7Lista instâncias ativas.
    &a/{cmd} instances stop <id> &8- &7Encerra uma instância.
    &a/{cmd} servers &8- &7Status da rede.
    &7Jogador: &f/bw help
