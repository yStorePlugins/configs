# Recap do fim da partida (chat).
# {result} {team} {time} {top_finals} {top_beds} {prefix} {player} {value} {place}
recap:
  center: true
  result-win: '&eVencedor: Time {team}'
  result-draw: '&eEmpate'
  top-size: 3
  top-line: '{prefix} &f{player} &e- {value}'
  top-prefixes:
    - '&e1º'
    - '&d2º'
    - '&63º'
  lines:
    - ''
    - '&b&lBED WARS'
    - '{result}'
    - '&eTempo de partida: {time}'
    - ''
    - '&b&lTOP KILLS FINAIS:'
    - '{top_finals}'
    - ''
    - '&b&lTOP CAMAS QUEBRADAS:'
    - '{top_beds}'
    - ''
