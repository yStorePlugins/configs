#
# Classes por nível de estrela. Ao atingir o nível, o jogador
# pode coletar coins (Bed Wars) e cash (Vault) no menu.
#
# icon: bloco SetupItem (material, name, lore, glow).
#   material: MATERIAL, MATERIAL:DATA ou hash de https://minecraft-heads.com/custom-heads
#   Placeholders: {display} {level} {coins} {cash} {status}
#

menu:
  name: '&8Classes'
  size: 27

status:
  locked: '&cBloqueada'
  claimed: '&aRecompensa coletada'
  claim: '&eClique para coletar.'
  unlocked: '&aDesbloqueada'

