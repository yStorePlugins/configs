# Categorias disponíveis
# crie quantas quiser
categories:
  # Identificador
  spawners:
    # Nome nas mensagens
    display-name: '&aSpawners'
    # Comando customizado para abrir diretamente esta categoria
    # Deixe vazio para não usar
    command: ''
    # Permissão Bukkit para acessar esta categoria
    # Deixe vazio para não exigir
    permission: ''
    # Categoria que precisa estar 100% completa para desbloquear esta
    # Deixe vazio para não exigir
    requires-category: ''
    # Ícone no menu
    display:
      material: 'MOB_SPAWNER'
      name: '&aMetas de Spawners'
      lore:
        - '&7Os jogadores do servidor precisarão'
        - '&7matar &fMOBS&7 para ajudar no progresso'
        - '&7dessa missão.'
        - ''
        - '&c*Nenhuma missão encontrada para esta categoria.'
        - ''
    # Ícone no menu (quando a categoria estiver bloqueada por permissão ou requires-category)
    # Se não definir, usa o ícone display
    # display-locked:
    #   material: 'BARRIER'
    #   name: '&cCategoria bloqueada'
    #   lore:
    #     - '&7Complete a categoria anterior para desbloquear.'
    # Ícone no menu (quando tiver todas completas)
    display-completed:
      material: 'MOB_SPAWNER'
      name: '&aMetas de Spawners'
      lore:
        - '&7Os jogadores do servidor precisarão'
        - '&7matar &fMOBS&7 para ajudar no progresso'
        - '&7dessa missão.'
        - ''
        - '&a*Todas as missões dessa categoria foram concluídas.'
        - ''