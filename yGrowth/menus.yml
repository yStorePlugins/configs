# Sistema de menus.

# Setas dos menus (carregadas em Config.setup).
# Placeholders das setas: nenhum.
arrows:
  back:
    material: 'ARROW:0'
    name: '&cVoltar'
    lore:
      - ' &7Clique para voltar.'
  previous:
    material: 'ARROW:0'
    name: '&cAnterior'
    lore:
      - ' &7Clique para ir à página anterior.'
  next:
    material: 'ARROW:0'
    name: '&aPróximo'
    lore:
      - ' &7Clique para ir à próxima página.'

