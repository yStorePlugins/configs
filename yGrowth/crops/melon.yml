# Plantações extras: copie este arquivo, altere a chave (nome do arquivo)
# e os materiais. Não é necessário recompilar o plugin.

# Nome colorido exibido em menus e mensagens.
display-name: '&aMelancia'

# Se false, o plugin ignora esta plantação (crescimento vanilla).
enabled: true

# Velocidade de crescimento.
# 0.0 = bloqueado | 0.5 = 2x mais lento | 1.0 = vanilla | 2.0 = 2x mais rápido
# STEM: o multiplicador acelera a idade do caule. Frutos extras não são gerados.
multiplier: 1.0

# Tipo de crescimento. Valores: [AGEABLE, VERTICAL, STEM]
# STEM = caule de abóbora/melancia (idade 0-7) + fruto adjacente.
growth-type: STEM

# Idade máxima do caule (0-7).
max-age: 7

# Deslocamento de bits da idade no data do bloco (1.8).
age-shift: 0

# Máscara de bits da idade no data do bloco (1.8).
age-mask: 7

# Altura máxima (usado apenas em VERTICAL).
max-height: 1

# Se true, multiplicador > 1.0 pode avançar a idade do caule no mesmo evento.
allow-extra-stages: true

# Se true, exige ar nos 4 lados ao crescer para cima (cacto).
check-adjacent-air: false

# Mundos permitidos. Lista vazia = todos os mundos.
worlds: []

# Multiplicador específico por mundo. Sobrescreve 'multiplier' nesse mundo.
world-multipliers: {}

# Materiais do caule e do fruto (1.8 = MELON_BLOCK). Materiais inexistentes são ignorados.
materials:
  - MELON_STEM
  - ATTACHED_MELON_STEM
  - MELON
  - MELON_BLOCK

# Ícone do menu. Placeholders: {multiplier} {status} {name} {key} {type} {worlds}
icon:
  material: 'MELON'
  name: '&aMelancia'
  lore:
    - ''
    - ' &7Multiplicador: &f{multiplier}x'
    - ' &7Status: {status}'
    - ''
