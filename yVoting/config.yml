# Modo de depuração para correção de problemas no plugin.
debug-mode: false

database:
  # Determina o tipo de banco de dados. Valores válidos: [SQLITE, MYSQL, HIKARI (recomendado)]
  storage-type: SQLITE

  # Dados para conexão ao banco de dados MYSQL.
  data:
    # Endereço de conexão do banco de dados. [EX: 127.0.0.1]
    host: localhost
    # Porta de conexão do banco de dados. [EX: 3306]
    port: 3306
    # Nome do banco de dados a ser conectado. [EX: minecraft]
    database: ''
    # Usuário de conexão. [EX: root]
    username: ''
    # Senha do usuário de conexão: [EX: 123]
    password: ''

# Configurações do servidor redis
redis:
  # Ativar a conexão com o redis
  enabled: false
  # Endereço de conexão. [EX: 127.0.0.1]
  host: 'localhost'
  # Porta de conexão. [EX: 3306]
  port: 6379
  # Usuário de conexão. [EX: root]
  username: ''
  # Senha do usuário de conexão: [EX: 123]
  password: ''

# Delay para carregar os dados depois do login
# Necessário para usar em servidor de mina separado
# Recomendado: 20 ticks
login-delay: 20

# Integração com o FlipTop
# Cole o ID do anúncio Minecraft no FlipTop e o mesmo secret aqui.
# O plugin consulta o site periodicamente (funciona em host compartilhada).
fliptop:
  # UUID do anúncio Minecraft no FlipTop
  ad-id: ''
  # Secret compartilhado (mínimo 8 caracteres)
  secret: ''
  # URL base da API do FlipTop
  api-url: 'https://fliptop.site'
  # Link mostrado aos jogadores para votar
  vote-url: 'https://fliptop.site/br/minecraft/{ad-id}'
  poll:
    enabled: true
    # 100 ticks = 5 segundos
    interval-ticks: 200

# Sistemas gerais
general:
  top-limit: 10
  date-format: 'dd/MM/yyyy HH:mm'
  history-limit: 54

# Sons (nomes de Sound do Bukkit)
sounds:
  vote-success: ORB_PICKUP
  claim-success: ORB_PICKUP
  action-fail: VILLAGER_NO
