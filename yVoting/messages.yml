    &r
    &a/voto &8- &7Abre o menu de votos.
    &a/voto armazem &8- &7Abre o armazém de recompensas.
    &a/voto historico &8- &7Abre o histórico de votos.
    &a/voto perfil &8- &7Abre o seu perfil de votos.
    &a/voto top &8- &7Abre o ranking de votos.
