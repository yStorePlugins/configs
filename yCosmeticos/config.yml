# Discord: discord.ystoreplugins.com.br
# Site: ystoreplugins.com.br

# Modo de depuração para correção de problemas no plugin.
debug-mode: false

database:
  # Determina o tipo de banco de dados. Valores válidos: [SQLITE, MYSQL, HIKARI (recomendado)]
  storage-type: SQLITE

  # Dados para conexão ao banco de dados MYSQL.
  data:
    # Endereço de conexão do banco de dados. [EX: 127.0.0.1]
    host: localhost
    # Porta de conexão do banco de dados. [EX: 3306]
    port: 3306
    # Nome do banco de dados a ser conectado. [EX: minecraft]
    database: ''
    # Usuário de conexão. [EX: root]
    username: ''
    # Senha do usuário de conexão: [EX: 123]
    password: ''

# Configurações do servidor redis
redis:
  # Ativar a conexão com o redis
  enabled: false
  # Endereço de conexão. [EX: 127.0.0.1]
  host: 'localhost'
  # Porta de conexão. [EX: 3306]
  port: 6379
  # Usuário de conexão. [EX: root]
  username: ''
  # Senha do usuário de conexão: [EX: 123]
  password: ''

# Delay para carregar os dados depois do login
# Necessário para usar em servidor de mina separado
# Recomendado: 20 ticks
login-delay: 20

# Sistemas gerais
general:
  # Intervalo (em ticks) do motor de animação. 1 = a cada tick
  render-tick-interval: 1
  # Distância máxima de visualização dos effects
  view-distance: 48.0
  # Esconder cosméticos quando o jogador está vanished
  hide-on-vanish: true
  # Se true, todos os jogadores podem usar qualquer cosmético sem precisar receber
  give-all-by-default: false
  # Esconder cosméticos no 1v1 do yLobby
  hide-in-battle: true
  # Esconder cosméticos no FFA/arena do yLobby
  hide-in-ffa: true
  # Esconder cosméticos no parkour do yLobby
  hide-in-parkour: true
  # Esconder cosméticos no vanish do yLobby
  hide-in-vanish: true
  # Esconder cosméticos no modo espectador
  hide-in-spectator: true
  # Bloquear menu/equipar enquanto estiver em combate/parkour/vanish
  block-menu-when-hidden: true
  # Mundos onde os cosméticos não aparecem
  disabled-worlds: []
  sounds:
    equip: 'ENTITY_EXPERIENCE_ORB_PICKUP'
    unequip: 'ENTITY_ITEM_BREAK'
    fail: 'ENTITY_VILLAGER_NO'

