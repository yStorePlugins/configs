# Providers disponíveis:
#
#   AtlasEconomiaSecundaria, AtlasMinas, AtlasMinasV2,
#   JH_Shop, LegendaryEconomy, NextCash, PlayerPoints,
#   StormEconomiaSecundaria, StormMinas, TGCash,
#   yAlmas, yPoints, yRankup,
#   Vault
#

# Economia padrão usada ao abrir o pedido de empréstimo.
default: 'money'

economies:
  money:
    # Provider enviado ao PointsManager (Vault/Money)
    provider: 'Money'
    # Nome colorido exibido nos menus e mensagens
    display: 'Dinheiro'
    # Abreviação exibida em lores
    abbreviated: 'coins'
    # Se true, permite transações mesmo com o jogador offline
    allow-offline: true
    # Permissão necessária para usar esta economia. Vazio = todos
    permission: ''
    item-settings:
      material: GOLD_INGOT
      name: '&aDinheiro'
      lore:
        - ''
        - ' &7Tipo: &fMoney'
        - ' &aClique para selecionar'
        - ''
  playerpoints:
    provider: 'PlayerPoints'
    display: 'PlayerPoints'
    abbreviated: 'pp'
    allow-offline: true
    permission: ''
    item-settings:
      material: EMERALD
      name: '&aPlayerPoints'
      lore:
        - ''
        - ' &7Tipo: &fPlayerPoints'
        - ' &aClique para selecionar'
        - ''
