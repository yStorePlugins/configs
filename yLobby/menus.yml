        - ''
        - '&aClique para entrar'
    challenge:
      slot: 13
      material: 'BLAZE_ROD:0'
      name: '&aDesafiar um jogador'
      lore:
        - ''
        - ' &7Desafie um jogador do lobby'
        - ' &7para uma batalha com você.'
        - ''
        - '&aClique para desafiar'
    profile:
      slot: 15
      material: '{player}'
      name: '&aSeu Perfil'
      lore:
        - ''
        - ' &fAbates: &7{kills}'
        - ' &fMortes: &7{deaths}'
        - ' &fKDR: &7{kdr}'
        - ''
